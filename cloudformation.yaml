AWSTemplateFormatVersion: "2010-09-09"
Transform: "AWS::Serverless-2016-10-31"
Description: AWS SAM stack that notifies when a delivery driver is distant from their vehicle
Parameters:
  AppGroup:
    Type: String
    Default: "travis-service"
  DatabaseEngine:
    Type: "String"
    Default: "aurora-mysql"
  DatabaseName:
    Type: "String"
    Default: "travisservice"
  Environment:
    Type : "AWS::SSM::Parameter::Value<String>"
    Default: "/global/environment"
    Description: "Environment in which resources are deployed."
  Region:
    Description: "Specify the region"
    Type: "String"
    Default: "eu-west-1"
Globals:
  Function:
    Runtime: dotnet6
Resources:
  AuroraMySQLCluster:
    Type: "AWS::RDS::DBCluster"
    Properties:
      DBClusterIdentifier: !Sub "${AppGroup}-db-cluster"
      BackupRetentionPeriod: 35
      DatabaseName: !Ref "DatabaseName"
      Engine: !Ref "DatabaseEngine"
      EngineMode: "serverless"
      ServerlessV2ScalingConfiguration:
        MaxCapacity: 8
        MinCapacity: 0.5
      MasterUsername: "master"
      MasterUserPassword: "root"
      StorageEncrypted: true
      EnableCloudwatchLogsExports:
        - "error"
      PerformanceInsightsEnabled: true
      VpcSecurityGroupIds:
        - !Ref "AuroraMySQLClusterSecurityGroup"
      Tags:
        - Key: "Name"
          Value: !Sub "${Environment}-private-${AppGroup}-db-cluster"
  AuroraMySQLClusterParameterGroup:
    Type: "AWS::RDS::DBClusterParameterGroup"
    Properties:
      Description: !Sub "${AppGroup} Aurora Cluster Parameter Group"
      Family: "aurora-mysql5.7"
      Parameters:
        time_zone: "UTC"
      Tags:
        - Key: "Name"
          Value: !Sub "${Environment}-private-${AppGroup}-db-cluster-parameter-group"
  AuroraMySQLClusterSecurityGroup:
    Type: "AWS::EC2::SecurityGroup"
    Properties:
      GroupDescription: "Allows incoming/outgoing traffic to/from the internal resources"
      VpcId: !ImportValue "infrastructure-vpc"
      SecurityGroupIngress:
        - Description: "Allow EC2 instances to access MySQL"
          IpProtocol: "tcp"
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref "PrivateSecurityGroup"
  AuroraMySQLInstance:
    Type: "AWS::RDS::DBInstance"
    DeletionPolicy: "Delete"
    Properties:
      AllowMajorVersionUpgrade: false
      AutoMinorVersionUpgrade: true
      DBClusterIdentifier: !Ref "AuroraMySQLCluster"
      DBInstanceIdentifier: !Sub "${Environment}-${AppGroup}-db-instance"
      DBParameterGroupName: !Ref "AuroraMySQLParameterGroup"
      Engine: !Ref "DatabaseEngine"
  AuroraPrivateEgress:
    Type: "AWS::EC2::SecurityGroupEgress"
    Properties:
      GroupId: !Ref "PrivateSecurityGroup"
      IpProtocol: "tcp"
      FromPort: 3306
      ToPort: 3306
      DestinationSecurityGroupId: !Ref "AuroraMySQLClusterSecurityGroup"
  AuroraPrivateIngress:
    Type: "AWS::EC2::SecurityGroupIngress"
    Properties:
      GroupId: !Ref "PrivateSecurityGroup"
      IpProtocol: "tcp"
      FromPort: 3306
      ToPort: 3306
      SourceSecurityGroupId: !Ref "AuroraMySQLClusterSecurityGroup"
  DynamoDBManagedPolicy:
    Type: "AWS::IAM::ManagedPolicy"
    Properties:
      Description: "Allows Functions access to the required resources."
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Action:
              - "dynamodb:GetItem"
              - "dynamodb:Query"
            Resource:
              - !GetAtt "DynamoDb.Arn" #The ARN of the Lookup table
  HandheldEventDeadLetterQueue:
    Type: "AWS::SQS::Queue"
    Properties:
      QueueName: !Sub "${AppGroup}-handheldEvent-dlq"
      MessageRetentionPeriod: 1209600
      Tags:
        - Key: Name
          Value: !Sub "${AppGroup}-handheldEvent-dlq"
  HandheldEventProcessorFunction:
    Type: "AWS::Serverless::Function"
    Properties:
      Handler: "TravisService.Functions.HandheldEventProcessor::TravisService.Functions.HandheldEventProcessor.Function::Handler"
      CodeUri: ./artifacts/TravisService.Functions.HandheldEventProcessor.zip
      Description: I save all handheld devide events once they are made known to me
      MemorySize: 256
      Timeout: 300 #5minutes
      FunctionName: !Sub "${AppGroup}-handheldEvent-processor"
      VpcConfig:
        SecurityGroupIds:
          - !Ref "PrivateSecurityGroup"
      Role: !Ref TravisServiceRole
      Environment:
        Variables:
          Environment: !Ref Environment
      Events:
        RecievedMessageInQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt "HandheldEventQueue.Arn"
            BatchSize: 10
  HandheldEventQueue:
    Type: "AWS::SQS::Queue"
    Properties:
      FifoQueue: true
      QueueName: !Sub "${AppGroup}-handheldEvent-queue.fifo"
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt "HandheldEventDeadLetterQueue.Arn"
        maxReceiveCount: 3
      VisibilityTimeout: 15
      Tags:
        - Key: Name
          Value: !Sub "${AppGroup}-handheldEvent-queue.fifo"
  HandheldEventQueuePolicy:
    Type: "AWS::SQS::QueuePolicy"
    Properties:
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: "*"
            Action:
              - sqs:SendMessage
            Resource: !GetAtt "HandheldEventQueue.Arn"
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt "SomeTopic.Arn" #This is the topic that pushes events from IOT to this queue
      Queues:
        - !Ref HandheldEventQueue
  PrivateSecurityGroup:
      Type: "AWS::EC2::SecurityGroup"
      Properties:
        GroupDescription: "Allows incoming/outgoing traffic to/from the internal resources"
        SecurityGroupEgress:
          - CidrIp: "0.0.0.0/0"
            FromPort: 443
            ToPort: 443
            IpProtocol: "tcp"
        Tags:
          - Key: "Name"
            Value: !Sub "${AWS::StackName}-private"
  QueueManagedPolicy:
    Type: "AWS::IAM::ManagedPolicy"
    Properties:
      Description: "Allows Functions access to the required resources."
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Action:
              - "sqs:ChangeMessageVisibility"
              - "sqs:ChangeMessageVisibilityBatch"
              - "sqs:DeleteMessage"
              - "sqs:DeleteMessageBatch"
              - "sqs:GetQueueAttributes"
              - "sqs:ReceiveMessage"
              - "sqs:SendMessage"
              - "sqs:SendMessageBatch"
            Resource:
              - !GetAtt "HandheldEventQueue.Arn"
              - !GetAtt "HandheldEventDeadLetterQueue.Arn"
              - !GetAtt "VehicleEventQueue.Arn"
              - !GetAtt "VehicleEventDeadLetterQueue.Arn"
  SnsManagedPolicy:
    Type: "AWS::IAM::ManagedPolicy"
    Properties:
      Description: "Allows Functions access to the required resources."
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Action:
              - "sns:Publish"
            Resource:
              - !GetAtt "Sns.Arn" #The ARN of the alert topic
  TravisServiceRole:
    Type: "AWS::IAM::Role"
    Properties:
      RoleName: !Ref "AppGroup"
      Tags:
        - Key: "Name"
          Value: !Sub "${AppGroup}-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal:
              Service:
                - "lambda.amazonaws.com"
            Action:
              - "sts:AssumeRole"
      ManagedPolicyArns:
        - !Ref QueueManagedPolicy
        - !Ref SnsManagedPolicy
        - !Ref DynamoDBManagedPolicy
  VehicleEventDeadLetterQueue:
    Type: "AWS::SQS::Queue"
    Properties:
      QueueName: !Sub "${AppGroup}-vehicleEvent-dlq"
      MessageRetentionPeriod: 1209600
      Tags:
        - Key: Name
          Value: !Sub "${AppGroup}-vehicleEvent-dlq"
  VehicleEventProcessorFunction:
    Type: "AWS::Serverless::Function"
    Properties:
      Handler: "TravisService.Functions.VehicleEventProcessor::TravisService.Functions.VehicleEventProcessor.Function::Handler"
      CodeUri: ./artifacts/TravisService.Functions.VehicleEventProcessor.zip
      Description: I check the location of a vehicle and compare it to the handheld device
      MemorySize: 256
      Timeout: 300 #5minutes
      FunctionName: !Sub "${AppGroup}-vehicleEvent-processor"
      VpcConfig:
        SecurityGroupIds:
          - !Ref "PrivateSecurityGroup"
      Role: !Ref TravisServiceRole
      Environment:
        Variables:
          Environment: !Ref Environment
      Events:
        RecievedMessageInQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt "VehicleEventQueue.Arn"
            BatchSize: 10
  VehicleEventQueue:
    Type: "AWS::SQS::Queue"
    Properties:
      QueueName: !Sub "${AppGroup}-vehicleEvent-queue"
      DelaySeconds: 60
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt "VehicleEventDeadLetterQueue.Arn"
        maxReceiveCount: 3
      VisibilityTimeout: 30
      Tags:
        - Key: Name
          Value: !Sub "${AppGroup}-vehicleEvent-queue"
  VehicleEventQueuePolicy:
    Type: "AWS::SQS::QueuePolicy"
    Properties:
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: "*"
            Action:
              - sqs:SendMessage
            Resource: !GetAtt "VehicleEventQueue.Arn"
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt "SomeTopic.Arn" #This is the topic that pushes events from IOT to this queue
      Queues:
        - !Ref VehicleEventQueue